# Example for a single direct-client Nginx hop. Replace the domain, TLS paths
# and /srv/antique paths; do not install unchanged. Gunicorn must listen only
# on 127.0.0.1:8000, never publicly. See README for additional proxy hops.
server {
    listen 443 ssl;
    server_name shop.example;
    ssl_certificate /etc/letsencrypt/live/shop.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example/privkey.pem;
    client_max_body_size 64k;
    location /static/ { alias /srv/antique/staticfiles/; }
    location /media/ { alias /srv/antique/media/; }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For "";
    }
}
server {
    listen 80;
    server_name shop.example;
    return 301 https://shop.example$request_uri;
}
